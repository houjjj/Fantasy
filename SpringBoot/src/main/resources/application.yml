spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.73:30027/cust1?useSSL=false&serverTimezone=Asia/Shanghai
#    url: jdbc:mysql://192.102.31.141:31092/cust1?useSSL=false&serverTimezone=Asia/Shanghai
    username: k8sadmin
    password: k8sadmin

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 200
      max-wait: 60000
#      time-between-eviction-runs-millis: 60000
#      min-evictable-idle-time-millis: 300000
#      validation-query: SELECT 1
      test-while-idle: false
      test-on-borrow: false
      test-on-return: false
#      pool-prepared-statements: true

      # 监控统计拦截的filters
      filters: stat,wall,slf4j

      # Druid Web 监控页面设置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        reset-enable: false

      # SQL监控
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
